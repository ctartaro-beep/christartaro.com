: "", "source": "Haskell", "format": "Spotify", "image": ""}, {"year": "2022", "date": "Summer 2022", "artist": "Musical Miracle", "album": "Hawaii Pt. 2", "wikiLink": "https://en.wikipedia.org/wiki/Tally_Hall", "source": "Nedaa Sweiss", "format": "Spotify", "image": "https://static.wikia.nocookie.net/tallyhall/images/6/6f/Hawaii_Part_II.jpeg/revision/latest/scale-to-width-down/200?cb=20150728020848"}];
    
    let isGridView = false;
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function renderTimeline() {
        const container = document.querySelector('#chris-music-timeline-root .cmt-timeline-events');
        
        container.innerHTML = timelineData.map(event => {
            const imageHtml = event.image ? 
                `<img src="${escapeHtml(event.image)}" alt="${escapeHtml(event.album)}" class="cmt-event-image" onerror="this.style.display='none'">` : 
                '';
            
            const wikiLink = event.wikiLink ? 
                `<a href="${escapeHtml(event.wikiLink)}" target="_blank" rel="noopener" class="cmt-wiki-link">📖 Wiki</a>` : 
                '';
            
            return `
                <div class="cmt-timeline-event genre-${event.genre}">
                    <div class="cmt-timeline-dot"></div>
                    <div class="cmt-event-card">
                        <div class="cmt-event-image-container">
                            ${imageHtml}
                            ${event.format ? `<div class="cmt-format-badge">${escapeHtml(event.format)}</div>` : ''}
                        </div>
                        <div class="cmt-event-content">
                            <div class="cmt-event-header">
                                <div class="cmt-year-badge">${escapeHtml(event.date)}</div>
                                <div class="cmt-artist-name">${escapeHtml(event.artist)}</div>
                            </div>
                            <h2 class="cmt-event-title">${escapeHtml(event.album)}</h2>
                            <div class="cmt-event-meta">
                                ${event.source ? `
                                    <div class="cmt-meta-item">
                                        <span>👤</span>
                                        <span>${escapeHtml(event.source)}</span>
                                    </div>
                                ` : ''}
                            </div>
                            ${wikiLink}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function renderGrid() {
        const container = document.querySelector('#chris-music-timeline-root .cmt-grid-container');
        
        container.innerHTML = timelineData.map(event => {
            const imageHtml = event.image ? 
                `<img src="${escapeHtml(event.image)}" alt="${escapeHtml(event.album)}" class="cmt-grid-image" onerror="this.style.display='none'">` : 
                '';
            
            return `
                <div class="cmt-grid-item genre-${event.genre}">
                    <div class="cmt-grid-image-container">
                        ${imageHtml}
                    </div>
                    <div class="cmt-grid-content">
                        <div class="cmt-grid-artist">${escapeHtml(event.artist)}</div>
                        <div class="cmt-grid-title">${escapeHtml(event.album)}</div>
                        <div class="cmt-grid-year">${escapeHtml(event.date)}</div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function init() {
        const root = document.getElementById('chris-music-timeline-root');
        
        root.innerHTML = `
            <div class="cmt-background-texture"></div>
            <div class="cmt-header">
                <div class="cmt-header-content">
                    <div class="cmt-header-text">
                        <h1>Chris' Music Timeline</h1>
                        <p class="cmt-subtitle">150 albums spanning 1986 - 2022</p>
                        <div class="cmt-genre-legend">
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-rock);"></div>
                                <span>Rock</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-hiphop);"></div>
                                <span>Hip-Hop</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-indie);"></div>
                                <span>Indie</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-jazz);"></div>
                                <span>Jazz</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-classical);"></div>
                                <span>Classical</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-classic);"></div>
                                <span>80s</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-nineties);"></div>
                                <span>90s</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-twothousands);"></div>
                                <span>2000s</span>
                            </div>
                            <div class="cmt-legend-item">
                                <div class="cmt-legend-dot" style="background: var(--genre-modern);"></div>
                                <span>2010s+</span>
                            </div>
                        </div>
                    </div>
                    <div class="cmt-controls">
                        <div class="cmt-toggle-container">
                            <span class="cmt-toggle-label">🌙</span>
                            <div class="cmt-toggle-switch" id="cmt-theme-toggle">
                                <div class="cmt-toggle-slider"></div>
                            </div>
                            <span class="cmt-toggle-label">☀️</span>
                        </div>
                        <div class="cmt-toggle-container">
                            <span class="cmt-toggle-label">Timeline</span>
                            <div class="cmt-toggle-switch active" id="cmt-view-toggle">
                                <div class="cmt-toggle-slider"></div>
                            </div>
                            <span class="cmt-toggle-label">Album</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cmt-scroll-container" id="cmt-scroll-container">
                <div class="cmt-timeline-container" id="cmt-timeline-container">
                    <div class="cmt-timeline-line"></div>
                    <div class="cmt-timeline-events"></div>
                </div>
                <div class="cmt-grid-container"></div>
                <button class="cmt-scroll-top" id="cmt-scroll-top" aria-label="Scroll to top">↑</button>
            </div>
        `;
        
        renderTimeline();
        renderGrid();
        
        // Theme toggle
        document.getElementById('cmt-theme-toggle').addEventListener('click', function() {
            this.classList.toggle('active');
            root.classList.toggle('light-mode');
            localStorage.setItem('cmt-theme', root.classList.contains('light-mode') ? 'light' : 'dark');
        });
        
        // View toggle
        document.getElementById('cmt-view-toggle').addEventListener('click', function() {
            this.classList.toggle('active');
            isGridView = !isGridView;
            
            const timelineContainer = document.getElementById('cmt-timeline-container');
            const gridContainer = document.querySelector('.cmt-grid-container');
            
            if (isGridView) {
                timelineContainer.style.display = 'none';
                gridContainer.classList.add('active');
            } else {
                timelineContainer.style.display = 'block';
                gridContainer.classList.remove('active');
            }
        });
        
        // Scroll to top
        const scrollContainer = document.getElementById('cmt-scroll-container');
        const scrollTopBtn = document.getElementById('cmt-scroll-top');
        
        scrollContainer.addEventListener('scroll', () => {
            if (scrollContainer.scrollTop > 500) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });
        
        scrollTopBtn.addEventListener('click', () => {
            scrollContainer.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        
        // Load saved theme
        const savedTheme = localStorage.getItem('cmt-theme');
        if (savedTheme === 'light') {
            root.classList.add('light-mode');
            document.getElementById('cmt-theme-toggle').classList.add('active');
        }
    }
    
    init();
})();
</script>
