<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Musical Memoir - My Journey Through Sound</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 2rem 1.25rem 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #0a0a0a 100%);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            padding: 0 1rem;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(1.25rem, 5vw, 2rem);
            font-weight: 700;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #64c8ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: #a0a0a0;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-box {
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #64c8ff;
            display: block;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Chapter Sections */
        .chapter {
            padding: 2rem 2rem;
            position: relative;
        }

        .chapter.childhood {
            --chapter-primary: #ff9f40;
            --chapter-secondary: #ffd93d;
            --chapter-glow: rgba(255, 159, 64, 0.2);
            --chapter-primary-rgb: 255, 159, 64;
            --chapter-secondary-rgb: 255, 217, 61;
        }

        .chapter.teen {
            --chapter-primary: #6bcfff;
            --chapter-secondary: #4ecdc4;
            --chapter-glow: rgba(107, 207, 255, 0.2);
            --chapter-primary-rgb: 107, 207, 255;
            --chapter-secondary-rgb: 78, 205, 196;
        }

        .chapter.twenties {
            --chapter-primary: #64c8ff;
            --chapter-secondary: #a78bfa;
            --chapter-glow: rgba(100, 200, 255, 0.2);
            --chapter-primary-rgb: 100, 200, 255;
            --chapter-secondary-rgb: 167, 139, 250;
        }

        .chapter.thirties {
            --chapter-primary: #a78bfa;
            --chapter-secondary: #c084fc;
            --chapter-glow: rgba(167, 139, 250, 0.2);
            --chapter-primary-rgb: 167, 139, 250;
            --chapter-secondary-rgb: 192, 132, 252;
        }

        .chapter.forties {
            --chapter-primary: #748ffc;
            --chapter-secondary: #64c8ff;
            --chapter-glow: rgba(116, 143, 252, 0.2);
            --chapter-primary-rgb: 116, 143, 252;
            --chapter-secondary-rgb: 100, 200, 255;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .chapter-number {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--chapter-primary), var(--chapter-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 auto 1rem;
            box-shadow: 0 0 30px var(--chapter-glow);
        }

        .chapter-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            margin-bottom: 0.35rem;
            font-weight: 700;
            color: var(--chapter-primary);
        }

        .chapter-subtitle {
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 0.75rem;
        }

        .chapter-narrative {
            max-width: 600px;
            margin: 0 auto;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #b0b0b0;
            padding: 0 1rem;
        }

        /* Timeline Layout */
        .albums-grid {
            position: relative;
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem 1rem 2rem 1rem;
        }

        /* Central vertical line */
        .albums-grid::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, 
                rgba(100, 200, 255, 0.3) 0%,
                rgba(167, 139, 250, 0.3) 50%,
                rgba(236, 72, 153, 0.3) 100%
            );
            transform: translateX(-50%);
        }

        /* Timeline item wrapper */
        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        /* Alternate left/right */
        .timeline-item:nth-child(odd) .album-card {
            margin-left: auto;
            margin-right: calc(50% + 0.75rem);
        }

        .timeline-item:nth-child(even) .album-card {
            margin-left: calc(50% + 0.75rem);
            margin-right: auto;
        }

        /* Connector dots on timeline */
        .timeline-item::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #64c8ff, #a78bfa);
            border: 3px solid #0a0a0a;
            border-radius: 50%;
            left: 50%;
            top: 2rem;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        /* Connector lines from timeline to cards */
        .timeline-item::after {
            content: '';
            position: absolute;
            height: 2px;
            background: rgba(100, 200, 255, 0.3);
            top: 2rem;
            transform: translateY(50%);
        }

        .timeline-item:nth-child(odd)::after {
            left: 50%;
            right: calc(50% + 0.75rem);
        }

        .timeline-item:nth-child(even)::after {
            left: calc(50% + 0.75rem);
            right: 50%;
        }

        /* Album Cards */
        .album-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            width: 280px;
            min-height: 360px;
            display: flex;
            flex-direction: column;
        }

        .album-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--chapter-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--chapter-glow);
        }

        .album-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .album-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .album-badges-left {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .year-badge {
            background: linear-gradient(135deg, #64c8ff, #a78bfa);
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.4rem 0.6rem;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(100, 200, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            white-space: nowrap;
        }

        .age-badge {
            background: linear-gradient(135deg, #ec4899, #f97316);
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.4rem 0.6rem;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            white-space: nowrap;
        }

        .album-art-wrapper {
            flex: 1;
        }

        .album-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .album-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .album-card:hover .album-image img {
            transform: scale(1.05);
        }

        .album-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            color: var(--chapter-primary);
            background: linear-gradient(135deg, rgba(var(--chapter-primary-rgb), 0.1), rgba(var(--chapter-secondary-rgb), 0.1));
            text-transform: uppercase;
        }

        .album-info {
            padding: 0.5rem 0;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .album-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #e0e0e0;
            line-height: 1.3;
            min-height: 2.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .album-artist {
            font-size: 0.95rem;
            color: #a0a0a0;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            min-height: 1.3rem;
        }

        .album-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #808080;
            margin-bottom: 0.75rem;
        }

        .album-year {
            color: #a0a0a0;
        }

        .album-badges {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .format-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #c0c0c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .format-badge:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }

        .association-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, var(--chapter-primary), var(--chapter-secondary));
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .association-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--chapter-glow);
        }

        .association-badge:active {
            transform: scale(0.95);
        }

        /* Filter Bar */
        .filter-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 1rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 1000;
            border-bottom: 2px solid var(--filter-color, #64c8ff);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .filter-bar.active {
            display: flex;
        }

        .filter-bar-text {
            color: #e0e0e0;
            font-size: 1rem;
        }

        .filter-bar-badge {
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--filter-color, #64c8ff), var(--filter-secondary, #a78bfa));
            border-radius: 20px;
            color: #000;
            font-weight: 700;
        }

        .filter-bar-close {
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .filter-bar-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .timeline-item:has(.album-card.filtered-out) {
            display: none;
        }

        .album-card.filtered-out {
            display: none;
        }

        /* When filtering is active, hide chapter headers and create unified grid */
        body.filtering-active .hero {
            display: none;
        }

        body.filtering-active .chapter-header {
            display: none;
        }

        body.filtering-active .albums-grid {
            padding: 0 2rem;
        }

        body.filtering-active .chapter {
            padding: 2rem;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .albums-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 0 1rem;
            }

            .albums-grid .album-card:nth-child(odd),
            .albums-grid .album-card:nth-child(even) {
                transform: none;
                margin-top: 0;
                justify-self: stretch;
                width: 100%;
                max-width: 100%;
            }

            .chapter {
                padding: 3rem 1rem;
            }

            .chapter-title {
                font-size: 2rem;
            }

            .chapter-subtitle {
                font-size: 1rem;
            }

            .chapter-narrative {
                font-size: 1rem;
                padding: 0 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 1.5rem 1rem;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            .hero-subtitle {
                font-size: 0.85rem;
            }

            .hero-stats {
                grid-template-columns: 1fr;
                max-width: 280px;
            }
        }
    
        .filter-count {
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(167, 139, 250, 0.3);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .album-art-wrapper {
                width: 100%;
            }
            
            .album-image {
                width: 100%;
                aspect-ratio: 1 / 1;
                height: auto;
            }
            
            .album-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            
            .album-placeholder {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

    <!-- Hero Section -->
    <section class="hero">

    </section>

        const chapterConfig = {
            childhood: { number: 'I', class: 'childhood' },
            teen: { number: 'II', class: 'teen' },
            twenties: { number: 'III', class: 'twenties' },
            thirties: { number: 'IV', class: 'thirties' },
            forties: { number: 'V', class: 'forties' }
        };

        const chapterOrder = ['childhood', 'teen', 'twenties', 'thirties', 'forties'];

        let currentFilter = null;

        function filterByAssociation(association) {
            currentFilter = { type: 'association', value: association };
            
            // Add filtering class to body
            document.body.classList.add('filtering-active');
            

            // Count albums with this association
            let count = 0;
            chapterOrder.forEach(key => {
                const stage = journeyData[key];
                count += stage.albums.filter(a => a.source === association).length;
            });
            
            // Update filter bar
            const filterBar = document.getElementById('filter-bar');
            const filterBadge = document.getElementById('filter-badge');
            filterBadge.textContent = `$ • $ album${count !== 1 ? 's' : ''}`;
            filterBar.classList.add('active');
            
            // Filter cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                const cardAssociation = card.dataset.association;
                if (cardAssociation === association) {
                    card.classList.remove('filtered-out');
                } else {
                    card.classList.add('filtered-out');
                }
            });
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }


        function filterByFormat(format) {
            if (!format) {
                clearFilter();
                return;
            }
            
            currentFilter = { type: 'format', value: format };
            
            // Add filtering class to body
            document.body.classList.add('filtering-active');
            

            // Count albums with this format
            let count = 0;
            chapterOrder.forEach(key => {
                const stage = journeyData[key];
                count += stage.albums.filter(a => {
                    const albumFormat = a.format || '';
                    return albumFormat.includes(format);
                }).length;
            });
            
            // Update filter bar
            const filterBar = document.getElementById('filter-bar');
            const filterBadge = document.getElementById('filter-badge');
            filterBadge.textContent = `Format: $ • $ album${count !== 1 ? 's' : ''}`;
            filterBar.classList.add('active');
            
            // Filter cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                const cardFormat = card.dataset.format || '';
                if (cardFormat.includes(format)) {
                    card.classList.remove('filtered-out');
                } else {
                    card.classList.add('filtered-out');
                }
            });
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearFilter() {
            currentFilter = null;
            
            // Remove filtering class from body
            document.body.classList.remove('filtering-active');
            
            // Hide filter bar
            const filterBar = document.getElementById('filter-bar');
            filterBar.classList.remove('active');
            

            // Show all cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                card.classList.remove('filtered-out');
            });
        }


        // Album art fallback using iTunes API
        async function fetchAlbumArt(artist, album) {
            try {
                // Clean up artist and album names for search
                const cleanArtist = artist.replace(/[^\w\s]/g, '').trim();
                const cleanAlbum = album.replace(/[^\w\s]/g, '').trim();
                
                // Try iTunes API first
                const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist + ' ' + cleanAlbum)}&entity=album&limit=1`;
                const response = await fetch(itunesUrl);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    // Get high-res artwork (600x600)
                    let artworkUrl = data.results[0].artworkUrl100;
                    if (artworkUrl) {
                        artworkUrl = artworkUrl.replace('100x100bb', '600x600bb');
                        return artworkUrl;
                    }
                }
                
                // If iTunes fails, try MusicBrainz Cover Art Archive
                // This requires a release ID, so we'll search MusicBrainz first
                const mbUrl = `https://musicbrainz.org/ws/2/release/?query=artist:${encodeURIComponent(cleanArtist)}%20AND%20release:${encodeURIComponent(cleanAlbum)}&fmt=json&limit=1`;
                const mbResponse = await fetch(mbUrl);
                const mbData = await mbResponse.json();
                
                if (mbData.releases && mbData.releases.length > 0) {
                    const releaseId = mbData.releases[0].id;
                    const coverArtUrl = `https://coverartarchive.org/release/$/front-500`;
                    
                    // Check if cover art exists
                    const coverResponse = await fetch(coverArtUrl, { method: 'HEAD' });
                    if (coverResponse.ok) {
                        return coverArtUrl;
                    }
                }
            } catch (error) {
                console.log('Could not fetch album art for:', artist, '-', album);
            }
            
            return null;
        }

        // Handle image loading errors with fallback
        function handleImageError(img) {
            // Don't try again if we already tried fetching
            if (img.dataset.fetchAttempted) {
                return;
            }
            
            img.dataset.fetchAttempted = 'true';
            
            // Get artist and album from data attributes
            const artist = img.dataset.artist || '';
            const album = img.dataset.album || '';
            
            // Try to fetch album art
            fetchAlbumArt(artist, album).then(artworkUrl => {
                if (artworkUrl) {
                    img.src = artworkUrl;
                } else {
                    // Show placeholder with first letter
                    const placeholder = document.createElement('div');
                    placeholder.className = 'album-placeholder';
                    placeholder.textContent = (artist || album || '♪')[0].toUpperCase();
                    img.parentElement.innerHTML = '';
                    img.parentElement.appendChild(placeholder);
                }
            });
        }

        function renderJourney() {
            const container = document.getElementById('journey-container');
            
            chapterOrder.forEach((key) => {
                const stage = journeyData[key];
                const config = chapterConfig[key];
                const chapterDiv = document.createElement('div');
                chapterDiv.className = `chapter $`;
                
                let html = `
                    <div class="chapter-header">
                        <div class="chapter-number">$</div>
                        <h2 class="chapter-title">$</h2>
                        <div class="chapter-subtitle">$</div>
                        <p class="chapter-narrative">$</p>
                    </div>
                    <div class="albums-grid">
                `;
                
                stage.albums.forEach(album => {
                    const hasLink = album.wikiLink && album.wikiLink.trim() !== '';
                    const linkStart = hasLink ? `<a href="$" target="_blank" rel="noopener noreferrer" class="album-link">` : '';
                    const linkEnd = hasLink ? '</a>' : '';
                    
                    html += `
                        <div class="timeline-item">
                            <div class="album-card" data-association="${album.source || ''}" data-format="${album.format || ''}">
                                <div class="album-top">
                                    <div class="album-badges-left">
                                        <span class="year-badge">$</span>
                                        <span class="age-badge">Age $</span>
                                    </div>
                                    $
                                        <div class="album-art-wrapper">
                                            <div class="album-image">
                                                ${album.image ? `<img src="$" alt="$" loading="lazy" onerror="handleImageError(this)" data-artist="$" data-album="$">` : `<div class="album-placeholder">${(album.artist || album.album || '♪')[0].toUpperCase()}</div>`}
                                            </div>
                                        </div>
                                    $
                                </div>
                                <div class="album-info">
                                    <div class="album-title">$</div>
                                    <div class="album-artist">$</div>
                                    <div class="album-badges">
                                        <div>${album.format ? `<span class="format-badge" onclick="filterByFormat(this.textContent.split(',')[0].trim())">$</span>` : ''}</div>
                                        <div>${album.source ? `<span class="association-badge" onclick="filterByAssociation(this.textContent)">$</span>` : ''}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                chapterDiv.innerHTML = html;
                container.appendChild(chapterDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', renderJourney);

        // Keyboard support - Escape to clear filter
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && currentFilter) {
                clearFilter();
            }
        });
    </script>
