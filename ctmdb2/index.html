    <style>
        /* Matches christartaro.com: always dark, Blue Highway D display type,
           Jost body, IBM Plex Mono metadata, studio-tally red as the one accent. */
        :root {
            color-scheme: dark;
            --bg: #111110;
            --surface: #1c1c1a;
            --fg: #ededea;
            --muted: #9a9993;
            --rule: #2c2c29;
            --tally: #ff4436;
            --display: "Blue Highway D", "Arial Narrow", "Futura", sans-serif;
            --body: "Jost", "Futura", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
            --card-w: 280px;
            --gap: 28px;
        }
        @font-face {
            font-family: "Blue Highway D";
            src: url("../fonts/blue-highway-d.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--fg);
            font: 400 1rem/1.5 var(--body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--tally); outline-offset: 3px; }

        .wrap {
            max-width: 1320px;
            margin-inline: auto;
            padding-left: max(24px, env(safe-area-inset-left, 0px));
            padding-right: max(24px, env(safe-area-inset-right, 0px));
        }

        /* Masthead (same as the main site) */
        .masthead .wrap { padding-block: clamp(32px, 6vw, 72px) 0; }
        .name {
            display: inline-block;
            font: 400 clamp(2.4rem, 7vw, 5rem)/0.95 var(--display);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            margin-right: -0.06em;
        }
        .role {
            margin-top: 14px;
            font: 400 0.8rem/1.4 var(--mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Page title + stats */
        .hero { border-bottom: 1px solid var(--rule); }
        .hero-content {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px 40px;
            margin-top: clamp(28px, 4vw, 44px);
            padding-bottom: 18px;
        }
        .hero h1 {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font: 400 clamp(1.4rem, 3vw, 2rem)/1 var(--display);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .hero h1::before {
            content: "";
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--tally);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--tally) 22%, transparent);
        }
        .hero-subtitle {
            margin-top: 10px;
            font: 400 0.8rem/1.4 var(--mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .hero-stats { display: flex; gap: 32px; }
        .stat-box { display: flex; flex-direction: column; gap: 6px; }
        .stat-number {
            font: 400 clamp(1.6rem, 3vw, 2.2rem)/1 var(--display);
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }
        .stat-label {
            font: 400 0.7rem/1 var(--mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Chapters */
        .chapter { padding-top: clamp(48px, 7vw, 88px); }
        .chapter-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 36px;
        }
        .chapter-number {
            font: 400 0.75rem/1 var(--mono);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--tally);
            margin-bottom: 12px;
        }
        .chapter-number::before { content: "Chapter "; }
        .chapter-title {
            font: 400 clamp(1.5rem, 3.4vw, 2.4rem)/1.1 var(--display);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-wrap: balance;
        }
        .chapter-subtitle {
            margin-top: 10px;
            font: 400 0.75rem/1.4 var(--mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .chapter-narrative {
            max-width: 62ch;
            margin-top: 16px;
            font-size: 1.02rem;
            color: var(--muted);
            text-wrap: balance;
        }

        /* Timeline: one rule down the middle, cards alternate either side */
        .albums-grid {
            position: relative;
            max-width: calc(var(--card-w) * 2 + var(--gap) * 2 + 2px);
            margin: 0 auto;
            padding-bottom: 16px;
        }
        .albums-grid::before {
            content: "";
            position: absolute;
            left: 50%; top: 0; bottom: 0;
            width: 1px;
            background: var(--rule);
        }
        .timeline-item { position: relative; margin-bottom: 18px; }
        .timeline-item::before {
            /* tally-style dot on the rule */
            content: "";
            position: absolute;
            left: 50%; top: 22px;
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--rule);
            transform: translateX(-50%);
            z-index: 1;
            transition: background .15s, box-shadow .15s;
        }
        .timeline-item:hover::before {
            background: var(--tally);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--tally) 22%, transparent);
        }
        .timeline-item::after {
            content: "";
            position: absolute;
            top: 26px;
            height: 1px;
            width: var(--gap);
            background: var(--rule);
        }
        .timeline-item:nth-child(odd)::after { right: 50%; }
        .timeline-item:nth-child(even)::after { left: 50%; }
        .timeline-item:nth-child(odd) .album-card { margin-left: auto; margin-right: calc(50% + var(--gap)); }
        .timeline-item:nth-child(even) .album-card { margin-left: calc(50% + var(--gap)); margin-right: auto; }

        /* Album card */
        .album-card {
            position: relative;
            width: var(--card-w);
            display: flex;
            flex-direction: column;
        }
        .album-link { display: block; text-decoration: none; color: inherit; }
        .album-top { display: flex; flex-direction: column; gap: 10px; }
        .album-badges-left {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font: 400 0.72rem/1 var(--mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .year-badge { color: var(--fg); }
        .album-image {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: var(--surface);
        }
        .album-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform .5s cubic-bezier(.2,.7,.2,1);
        }
        .album-card:hover .album-image img { transform: scale(1.035); }
        .album-placeholder {
            position: absolute; inset: 0;
            display: flex; align-items: flex-end;
            padding: 16px 18px;
            font: 400 3rem/1 var(--display);
            text-transform: uppercase;
            color: var(--muted);
            background: #262623;
        }
        .album-info { display: flex; flex-direction: column; padding-top: 12px; }
        .album-title {
            font-size: 1rem;
            line-height: 1.35;
            text-wrap: pretty;
        }
        .album-link:hover ~ * .album-title,
        .album-card:hover .album-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
        .album-artist { margin-top: 2px; font-size: 0.92rem; color: var(--muted); }
        .album-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
        }
        .format-badge, .association-badge {
            display: inline-block;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 6px 9px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            font: 400 0.68rem/1 var(--mono);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }
        .format-badge:hover, .association-badge:hover { color: var(--fg); border-color: var(--tally); }

        /* Filter bar */
        .filter-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 18px;
            padding: max(12px, env(safe-area-inset-top, 0px)) 16px 12px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--rule);
            box-shadow: inset 0 -2px 0 var(--tally);
        }
        .filter-bar.active { display: flex; }
        .filter-bar-text {
            font: 400 0.72rem/1 var(--mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .filter-bar-badge {
            font: 400 1rem/1 var(--display);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .filter-bar-close {
            padding: 9px 15px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            background: none;
            color: var(--fg);
            font: 400 0.78rem/1 var(--display);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .filter-bar-close:hover { border-color: var(--tally); }

        .timeline-item:has(.album-card.filtered-out), .album-card.filtered-out { display: none; }
        body.filtering-active .hero-stats, body.filtering-active .chapter-header { display: none; }
        body.filtering-active .chapter { padding-top: 24px; }
        body.filtering-active main { padding-top: 56px; }

        /* Footer (same as the main site) */
        .foot { margin-top: 80px; border-top: 1px solid var(--rule); }
        .foot-row {
            display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
            padding-block: 26px 40px;
            font: 400 0.75rem/1.4 var(--mono);
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        .foot a { text-underline-offset: 3px; }

        /* Narrow screens: rule moves to the left, cards stack on its right */
        @media (max-width: 680px) {
            .albums-grid { max-width: none; }
            .albums-grid::before { left: 4px; }
            .timeline-item::before { left: 4px; }
            .timeline-item::after, .timeline-item:nth-child(odd)::after, .timeline-item:nth-child(even)::after {
                left: 9px; right: auto; width: 14px;
            }
            .timeline-item:nth-child(odd) .album-card,
            .timeline-item:nth-child(even) .album-card {
                width: auto;
                max-width: 420px;
                margin-left: 32px;
                margin-right: 0;
            }
            .timeline-item { margin-bottom: 30px; }
            .hero-stats { gap: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .album-image img { transition: none; }
        }
    </style>

        const chapterConfig = {
            childhood: { number: 'I', class: 'childhood' },
            teen: { number: 'II', class: 'teen' },
            twenties: { number: 'III', class: 'twenties' },
            thirties: { number: 'IV', class: 'thirties' },
            forties: { number: 'V', class: 'forties' }
        };

        const chapterOrder = ['childhood', 'teen', 'twenties', 'thirties', 'forties'];

        let currentFilter = null;

        function filterByAssociation(association) {
            currentFilter = { type: 'association', value: association };
            
            // Add filtering class to body
            document.body.classList.add('filtering-active');
            

            // Count albums with this association
            let count = 0;
            chapterOrder.forEach(key => {
                const stage = journeyData[key];
                count += stage.albums.filter(a => a.source === association).length;
            });
            
            // Update filter bar
            const filterBar = document.getElementById('filter-bar');
            const filterBadge = document.getElementById('filter-badge');
            filterBadge.textContent = `${association} • ${count} album${count !== 1 ? 's' : ''}`;
            filterBar.classList.add('active');
            
            // Filter cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                const cardAssociation = card.dataset.association;
                if (cardAssociation === association) {
                    card.classList.remove('filtered-out');
                } else {
                    card.classList.add('filtered-out');
                }
            });
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }


        function filterByFormat(format) {
            if (!format) {
                clearFilter();
                return;
            }
            
            currentFilter = { type: 'format', value: format };
            
            // Add filtering class to body
            document.body.classList.add('filtering-active');
            

            // Count albums with this format
            let count = 0;
            chapterOrder.forEach(key => {
                const stage = journeyData[key];
                count += stage.albums.filter(a => {
                    const albumFormat = a.format || '';
                    return albumFormat.includes(format);
                }).length;
            });
            
            // Update filter bar
            const filterBar = document.getElementById('filter-bar');
            const filterBadge = document.getElementById('filter-badge');
            filterBadge.textContent = `Format: ${format} • ${count} album${count !== 1 ? 's' : ''}`;
            filterBar.classList.add('active');
            
            // Filter cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                const cardFormat = card.dataset.format || '';
                if (cardFormat.includes(format)) {
                    card.classList.remove('filtered-out');
                } else {
                    card.classList.add('filtered-out');
                }
            });
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearFilter() {
            currentFilter = null;
            
            // Remove filtering class from body
            document.body.classList.remove('filtering-active');
            
            // Hide filter bar
            const filterBar = document.getElementById('filter-bar');
            filterBar.classList.remove('active');
            

            // Show all cards
            const cards = document.querySelectorAll('.album-card');
            cards.forEach(card => {
                card.classList.remove('filtered-out');
            });
        }


        // Album art fallback using iTunes API
        async function fetchAlbumArt(artist, album) {
            try {
                // Clean up artist and album names for search
                const cleanArtist = artist.replace(/[^\w\s]/g, '').trim();
                const cleanAlbum = album.replace(/[^\w\s]/g, '').trim();
                
                // Try iTunes API first
                const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanArtist + ' ' + cleanAlbum)}&entity=album&limit=1`;
                const response = await fetch(itunesUrl);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    // Get high-res artwork (600x600)
                    let artworkUrl = data.results[0].artworkUrl100;
                    if (artworkUrl) {
                        artworkUrl = artworkUrl.replace('100x100bb', '600x600bb');
                        return artworkUrl;
                    }
                }
                
                // If iTunes fails, try MusicBrainz Cover Art Archive
                // This requires a release ID, so we'll search MusicBrainz first
                const mbUrl = `https://musicbrainz.org/ws/2/release/?query=artist:${encodeURIComponent(cleanArtist)}%20AND%20release:${encodeURIComponent(cleanAlbum)}&fmt=json&limit=1`;
                const mbResponse = await fetch(mbUrl);
                const mbData = await mbResponse.json();
                
                if (mbData.releases && mbData.releases.length > 0) {
                    const releaseId = mbData.releases[0].id;
                    const coverArtUrl = `https://coverartarchive.org/release/${releaseId}/front-500`;
                    
                    // Check if cover art exists
                    const coverResponse = await fetch(coverArtUrl, { method: 'HEAD' });
                    if (coverResponse.ok) {
                        return coverArtUrl;
                    }
                }
            } catch (error) {
                console.log('Could not fetch album art for:', artist, '-', album);
            }
            
            return null;
        }

        // Handle image loading errors with fallback
        function handleImageError(img) {
            // Don't try again if we already tried fetching
            if (img.dataset.fetchAttempted) {
                return;
            }
            
            img.dataset.fetchAttempted = 'true';
            
            // Get artist and album from data attributes
            const artist = img.dataset.artist || '';
            const album = img.dataset.album || '';
            
            // Try to fetch album art
            fetchAlbumArt(artist, album).then(artworkUrl => {
                if (artworkUrl) {
                    img.src = artworkUrl;
                } else {
                    // Show placeholder with first letter
                    const placeholder = document.createElement('div');
                    placeholder.className = 'album-placeholder';
                    placeholder.textContent = (artist || album || '♪')[0].toUpperCase();
                    img.parentElement.innerHTML = '';
                    img.parentElement.appendChild(placeholder);
                }
            });
        }

        function renderJourney() {
            const container = document.getElementById('journey-container');
            
            chapterOrder.forEach((key) => {
                const stage = journeyData[key];
                const config = chapterConfig[key];
                const chapterDiv = document.createElement('div');
                chapterDiv.className = `chapter ${config.class}`;
                
                let html = `
                    <div class="chapter-header">
                        <div class="chapter-number">${config.number}</div>
                        <h2 class="chapter-title">${stage.title}</h2>
                        <div class="chapter-subtitle">${stage.subtitle}</div>
                        <p class="chapter-narrative">${stage.narrative}</p>
                    </div>
                    <div class="albums-grid">
                `;
                
                stage.albums.forEach(album => {
                    const hasLink = album.wikiLink && album.wikiLink.trim() !== '';
                    const linkStart = hasLink ? `<a href="${album.wikiLink}" target="_blank" rel="noopener noreferrer" class="album-link">` : '';
                    const linkEnd = hasLink ? '</a>' : '';
                    
                    html += `
                        <div class="timeline-item">
                            <div class="album-card" data-association="${album.source || ''}" data-format="${album.format || ''}">
                                <div class="album-top">
                                    <div class="album-badges-left">
                                        <span class="year-badge">${album.year}</span>
                                        <span class="age-badge">Age ${album.age}</span>
                                    </div>
                                    ${linkStart}
                                        <div class="album-art-wrapper">
                                            <div class="album-image">
                                                ${album.image ? `<img src="${album.image}" alt="${album.album}" loading="lazy" onerror="handleImageError(this)" data-artist="${album.artist}" data-album="${album.album}">` : `<div class="album-placeholder">${(album.artist || album.album || '♪')[0].toUpperCase()}</div>`}
                                            </div>
                                        </div>
                                    ${linkEnd}
                                </div>
                                <div class="album-info">
                                    <div class="album-title">${album.album}</div>
                                    <div class="album-artist">${album.artist}</div>
                                    <div class="album-badges">
                                        <div>${album.format ? `<span class="format-badge" onclick="filterByFormat(this.textContent.split(',')[0].trim())">${album.format}</span>` : ''}</div>
                                        <div>${album.source ? `<span class="association-badge" onclick="filterByAssociation(this.textContent)">${album.source}</span>` : ''}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                chapterDiv.innerHTML = html;
                container.appendChild(chapterDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => { renderJourney(); document.getElementById('year').textContent = new Date().getFullYear(); });

        // Keyboard support - Escape to clear filter
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && currentFilter) {
                clearFilter();
            }
        });
    </script>
