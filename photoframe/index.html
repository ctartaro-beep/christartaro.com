<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>photoframe — Chris Tartaro</title>
<!-- The frame itself (look and behavior) is shared with the family photoframe
     at ctartaro-beep.github.io/photoframe, so a fix there lands here too.
     Only config.js, next to this file, is specific to this page. -->
<link rel="stylesheet" href="https://ctartaro-beep.github.io/photoframe/style.css" />
<!-- Back-to-site link; this page only, not the family frame. -->
<link rel="stylesheet" href="mat.css?v=202610301810" />
</head>
<body>

  <div id="frame">
    <img id="photo-a" class="photo" draggable="false" alt="" />
    <img id="photo-b" class="photo" draggable="false" alt="" />
    <div id="overlay">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div id="caption"></div>
    <div id="pause-indicator">Paused — tap and hold to resume</div>
    <div id="status-line"></div>
  </div>

  <!-- Shows while the mouse moves (or after a tap), then fades away. -->
  <a id="home-link" href="/">&larr; christartaro.com</a>

  <script>
    // Back link and cursor: visible while you're moving the mouse, gone a
    // moment after you stop, so the frame stays clean.
    (function () {
      var link = document.getElementById("home-link");
      var timer = null, lastX = -1, lastY = -1;
      function wake() {
        document.body.classList.add("awake");
        clearTimeout(timer);
        timer = setTimeout(function () {
          // Stay up while the pointer rests on the link itself.
          var r = link.getBoundingClientRect();
          var over = lastX >= r.left && lastX <= r.right && lastY >= r.top && lastY <= r.bottom;
          if (over) wake(); else document.body.classList.remove("awake");
        }, 2500);
      }
      document.addEventListener("mousemove", function (e) {
        if (e.clientX === lastX && e.clientY === lastY) return; // not a real move
        lastX = e.clientX; lastY = e.clientY;
        wake();
      });
      document.addEventListener("pointerdown", wake);
      // Keep a click on the link from also counting as a tap/hold on the photo.
      ["pointerdown", "pointerup"].forEach(function (t) {
        link.addEventListener(t, function (e) { e.stopPropagation(); });
      });
    })();
  </script>
  <script src="config.js"></script>
  <script src="https://ctartaro-beep.github.io/photoframe/app.js"></script>
</body>
</html>
